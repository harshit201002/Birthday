name: Build and deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /Birthday/
          VITE_YOUTUBE_URL: ${{ vars.VITE_YOUTUBE_URL }}
      - name: Verify compiled assets
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          if (html.includes('/src/') || !/<script[^>]+src="\/Birthday\/assets\/[^\"]+\.js"/.test(html)) {
            throw new Error('Pages must deploy compiled Vite HTML under /Birthday/assets/.');
          }
          for (const [, url] of html.matchAll(/(?:src|href)="(\/Birthday\/[^\"]+)"/g)) {
            if (!existsSync(`dist/${url.slice('/Birthday/'.length)}`)) {
              throw new Error(`Missing built asset: ${url}`);
            }
          }
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
